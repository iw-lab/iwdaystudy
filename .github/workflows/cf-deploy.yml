name: Cloudflare Pages Auto Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

# deploy.yml도 태그 push(v*)에서 동일하게 Cloudflare Pages에 배포한다.
# create-release.sh는 `git push origin master --tags`로 master와 태그를 함께 push하므로
# 두 워크플로가 동시에 켜질 수 있다 — 같은 group으로 묶어 동시 배포를 막는다.
concurrency:
  group: cloudflare-pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # wrangler 4.121+ 는 Node >= 22 를 요구한다(next 는 >= 20.9).
          # 20 으로 두면 배포 단계에서 엔진 불일치로 깨질 수 있다.
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync version (package.json -> android/gradle, functions/api/version.ts)
        run: node scripts/sync-version.mjs

      # D1 마이그레이션은 여기서 돌리지 않는다.
      # 현재 CLOUDFLARE_API_TOKEN 에 D1:Edit 권한이 없어 `d1 execute --remote` 가
      # "Authentication error [code: 10000]" 으로 실패하고, 그 때문에 사이트 배포까지
      # 막혔다(2026-08-12 실측). 스키마 변경 시에는 배포 **전에** 로컬에서
      #   bash scripts/db-migrate.sh
      # 를 돌린다(README 참고). 토큰에 D1:Edit 을 부여하면 이 단계를 되살릴 수 있다.

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=araharu --branch=master --commit-dirty=true
