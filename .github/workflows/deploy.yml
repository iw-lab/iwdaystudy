name: Deploy & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump type'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      release_notes:
        description: 'Release notes (optional)'
        required: false
        default: ''

# cf-deploy.yml(master push마다)와 이 워크플로(태그 push)가 같은 커밋에서
# 동시에 Cloudflare Pages에 배포하는 경우가 있어(create-release.sh가
# `git push origin master --tags`로 두 ref를 함께 push) 같은 group으로 묶어
# 중복/동시 배포를 막는다.
concurrency:
  group: cloudflare-pages-deploy
  cancel-in-progress: false

jobs:
  # === 1. Build Web ===
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # wrangler 4.121+ 는 Node >= 22 를 요구한다(next 는 >= 20.9).
          # 20 으로 두면 배포 단계에서 엔진 불일치로 깨질 수 있다.
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync version (package.json -> android/gradle, functions/api/version.ts)
        run: node scripts/sync-version.mjs

      - name: Build
        run: npm run build

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: out/

  # === 2. Deploy to Cloudflare Pages + D1 ===
  deploy-web:
    needs: build-web
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # ⚠️ 이 단계를 빼면 wrangler-action 이 자기 기본 wrangler(3.90)를 이 저장소에
      #    설치하려다 @cloudflare/workers-types@5 와 peer 충돌(ERESOLVE)로 배포가 죽는다
      #    (2026-09-16 실측). devDependencies 의 wrangler 4.x 를 쓰게 먼저 설치한다.
      - name: Install dependencies
        run: npm ci

      - name: Download web build
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: out/

      - name: Sync version (functions/api/version.ts)
        # 이 job은 build-web과 별도 checkout이라 functions/ 는 여기서 다시 동기화해야
        # wrangler pages deploy가 올바른 버전을 배포한다 (out/ 은 web-build 아티팩트로 대체됨).
        run: node scripts/sync-version.mjs

      # D1 마이그레이션은 CI 에서 돌리지 않는다 — CLOUDFLARE_API_TOKEN 에 D1:Edit
      # 권한이 없어 실패하고 배포까지 막았다(2026-08-12 실측). 스키마를 바꿨으면
      # 배포 전에 로컬에서 `bash scripts/db-migrate.sh` 를 먼저 돌린다.

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=araharu --commit-message="deploy $(date +%Y%m%d-%H%M%S)"

  # === 3. Build APK ===
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync version (android/app/build.gradle)
        # 이 job은 npm ci/build를 돌리지 않으므로(prebuild 훅이 실행되지 않음)
        # package.json 버전을 gradle에 명시적으로 동기화해야 한다.
        run: node scripts/sync-version.mjs

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        # 기본 패키지 목록에 이미 폐기된 'tools' 가 들어 있어 sdkmanager 가 통째로 실패한다
        # ("Failed to find package 'tools'" → exit 1, 2026-09-16 실측). 필요한 것만 지정한다.
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: android
        run: |
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-build
          path: android/app/build/outputs/apk/release/*.apk

  # === 4. Create GitHub Release ===
  release:
    needs: [deploy-web, build-apk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: apk-build
          path: dist/

      - name: Determine version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # Tag push - use tag version
            VERSION="${GITHUB_REF#refs/tags/}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            # Manual trigger - bump from latest tag
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
            CURRENT="${LATEST_TAG#v}"
            IFS='.' read -r major minor patch <<< "$CURRENT"
            BUMP="${{ github.event.inputs.bump_type }}"
            case "$BUMP" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              *) patch=$((patch + 1)) ;;
            esac
            VERSION="v${major}.${minor}.${patch}"
          else
            # Push to master - auto bump patch
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
            CURRENT="${LATEST_TAG#v}"
            IFS='.' read -r major minor patch <<< "$CURRENT"
            patch=$((patch + 1))
            VERSION="v${major}.${minor}.${patch}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_num=${VERSION#v}" >> $GITHUB_OUTPUT
          echo "Determined version: $VERSION"

      - name: Rename APK
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mv dist/*.apk "dist/araharu-${VERSION}.apk" 2>/dev/null || true

      - name: Generate release notes
        id: notes
        run: |
          CUSTOM_NOTES="${{ github.event.inputs.release_notes }}"
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [ -n "$PREV_TAG" ]; then
            COMMIT_LOG=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s" --no-merges | head -20)
          else
            COMMIT_LOG=$(git log --pretty=format:"- %s" --no-merges -10)
          fi

          # Write to file to avoid escaping issues
          cat > release_notes.md << 'HEADER'
          ## 아라하루 ${{ steps.version.outputs.version }}
          HEADER

          if [ -n "$CUSTOM_NOTES" ]; then
            echo "" >> release_notes.md
            echo "$CUSTOM_NOTES" >> release_notes.md
          fi

          cat >> release_notes.md << 'MIDDLE'

          ### 변경사항
          MIDDLE
          echo "$COMMIT_LOG" >> release_notes.md

          cat >> release_notes.md << 'FOOTER'

          ### 설치 방법
          - **Android**: 아래 APK 파일을 다운로드하여 설치하세요
          - **iOS**: https://araharu-ecp.pages.dev 접속 → 공유 버튼(□↑) → "홈 화면에 추가"
          - **웹**: https://araharu-ecp.pages.dev

          ### 업데이트
          - Android 앱: 자동으로 업데이트를 감지합니다
          - iOS/웹: 새로고침 시 자동 업데이트됩니다
          FOOTER

      - name: Create tag (if not tag push)
        if: "!startsWith(github.ref, 'refs/tags/')"
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: "아라하루 ${{ steps.version.outputs.version }}"
          body_path: release_notes.md
          files: dist/*.apk
          draft: false
          prerelease: false
